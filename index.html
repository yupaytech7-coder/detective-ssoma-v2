<!doctype html>
<html lang="es">
<head><meta name="ms-sp-authoring-source" content="agent">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cargo de entrega editable</title>
<style>
:root{--az:#074f78;--az2:#0783b5;--cl:#eaf6fb;--bd:#afc0ca;--tx:#17242d}
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:var(--tx);font-family:Arial,sans-serif}.bar{position:sticky;top:0;z-index:20;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:11px;background:#07344f}.bar button,.upload{border:0;border-radius:8px;padding:10px 13px;color:#fff;background:var(--az2);font-weight:700;cursor:pointer}.bar .gray{background:#62727c}.bar .red{background:#ac2b21}.bar .green{background:#198754}.status{width:100%;text-align:center;color:white;font-size:12px}.page{width:min(1160px,calc(100% - 24px));margin:20px auto;background:white;padding:28px 32px;border-top:7px solid var(--az);box-shadow:0 5px 25px #263b4a25}.head{display:grid;grid-template-columns:155px 1fr 260px;border:1px solid var(--bd)}.logo{display:grid;place-items:center;min-height:110px;overflow:hidden}.logo img{max-width:100%;max-height:105px;object-fit:contain;padding:6px}.fallback{font-weight:900;color:var(--az);font-size:21px;text-align:center}.main-title,.meta{padding:12px}.main-title input{text-align:center;font-weight:800;color:var(--az);font-size:19px}.main-title textarea{text-align:center;color:#53636e;font-weight:700;min-height:48px}.meta{border-left:1px solid var(--bd);display:grid;gap:7px}.field{display:grid;grid-template-columns:145px 1fr;gap:8px;align-items:center}.field label{font-size:12px;font-weight:700;color:var(--az)}input,textarea{width:100%;border:1px solid #bccad2;border-radius:5px;padding:7px;font:inherit;background:#fff}textarea{resize:vertical}h2{margin:22px 0 9px;border-bottom:2px solid var(--az2);padding-bottom:5px;color:var(--az);font-size:15px}.editable-title{font-weight:800;color:var(--az);border:0;border-radius:0;padding:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;background:var(--cl);padding:13px;border-radius:8px}.constancia{min-height:110px;line-height:1.5}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:11px}th{background:var(--az);color:white;border:1px solid white;padding:8px 4px}td{border:1px solid var(--bd);height:39px;padding:3px;text-align:center}td input{border:0;padding:5px;min-width:90px}.num{width:35px;background:#f0f5f7;font-weight:700}.sig{min-width:132px}.sig button{padding:6px 8px;border:0;border-radius:5px;background:var(--az2);color:white;font-size:10px;cursor:pointer}.sig img{display:block;max-width:120px;max-height:40px;margin:auto}.remove{border:0;background:#b42318;color:#fff;border-radius:5px;padding:5px 7px;cursor:pointer}.responsable{display:grid;grid-template-columns:1fr 1fr;gap:24px}.obs{min-height:70px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center}.modal.open{display:flex}.card{width:min(570px,94vw);background:#fff;border-radius:12px;padding:18px}.card h3{margin-top:0;color:var(--az)}canvas{width:100%;height:230px;border:2px dashed #8ca5b3;border-radius:8px;touch-action:none}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.actions button{border:0;border-radius:7px;padding:9px 12px;color:#fff;background:var(--az2);font-weight:700}.actions .red{background:#b42318}.actions .gray{background:#667782}.footer{display:flex;justify-content:space-between;margin-top:20px;padding-top:8px;border-top:1px solid var(--bd);font-size:10px;color:#65747e}
@media(max-width:720px){.page{width:100%;margin:0;padding:14px}.head{grid-template-columns:1fr}.meta{border-left:0;border-top:1px solid var(--bd)}.grid,.responsable{grid-template-columns:1fr}.field{grid-template-columns:125px 1fr}}
@media print{@page{size:A4 landscape;margin:8mm}.bar,.modal,.sig button,.remove{display:none!important}body{background:#fff}.page{width:100%;margin:0;padding:0;box-shadow:none;border-top:4px solid var(--az)}input,textarea{border:0!important;padding:2px;background:transparent!important;color:#000;resize:none}.tw{overflow:visible}table{font-size:8.5px}td{height:28px;padding:1px}th{padding:4px 2px}.sig img{max-height:30px}.logo{min-height:80px}.logo img{max-height:76px}h2{margin:12px 0 5px}.constancia{min-height:65px}.footer{margin-top:8px}}
</style>
</head>
<body>
<div class="bar">
<label class="upload">Cargar logo<input id="logoFile" type="file" accept="image/png,image/jpeg,image/svg+xml" hidden></label>
<button onclick="addRow()">+ Agregar persona</button><button class="gray" onclick="saveData()">Guardar</button><button class="red" onclick="clearData()">Limpiar</button><button class="green" onclick="downloadPDF()">Descargar / guardar PDF</button>
<div class="status" id="status">Todos los campos del documento son editables.</div>
</div>
<main class="page" id="document">
<section class="head">
<div class="logo"><img id="logo" style="display:none" alt="Logo"><div id="fallback" class="fallback">RJ<br>GONZALES</div></div>
<div class="main-title"><input id="titulo" value="CARGO DE ENTREGA Y RECEPCIÓN"><textarea id="subtitulo">POLÍTICA DE SEGURIDAD Y SALUD EN EL TRABAJO Y MEDIO AMBIENTE</textarea></div>
<div class="meta">
<div class="field"><label>Código:</label><input id="codigo" value="SST-MA-001"></div><div class="field"><label>Versión:</label><input id="version" value="001"></div><div class="field"><label>Fecha de entrega:</label><input id="fecha" type="date" value="2026-10-25"></div>
</div></section>
<h2><input class="editable-title" id="t1" value="1. DATOS GENERALES"></h2>
<section class="grid">
<div class="field"><label>Empresa:</label><input id="empresa" value="RJ GONZALES"></div><div class="field"><label>Documento:</label><input id="documento" value="Política de SST y Medio Ambiente"></div><div class="field"><label>Versión:</label><input id="version2" value="001"></div><div class="field"><label>Fecha:</label><input id="fecha2" type="date" value="2026-10-25"></div>
</section>
<h2><input class="editable-title" id="t2" value="2. CONSTANCIA DE ENTREGA Y RECEPCIÓN"></h2>
<textarea id="constancia" class="constancia">Mediante el presente documento, los trabajadores que firman a continuación dejan constancia de haber recibido la Política de Seguridad y Salud en el Trabajo y Medio Ambiente de la empresa RJ GONZALES, versión 001. Asimismo, declaran haber sido informados sobre su contenido, responsabilidades y compromisos, obligándose a cumplir las disposiciones establecidas durante el desarrollo de sus actividades.</textarea>
<h2><input class="editable-title" id="t3" value="3. RELACIÓN DE PERSONAL"></h2>
<div class="tw"><table><thead><tr><th>N.°</th><th>APELLIDOS Y NOMBRES</th><th>DNI</th><th>CARGO</th><th>EMPRESA / ÁREA</th><th>FIRMA</th><th>FECHA</th><th>ACCIÓN</th></tr></thead><tbody id="rows"></tbody></table></div>
<h2><input class="editable-title" id="t4" value="4. RESPONSABLE DE LA ENTREGA"></h2>
<section class="responsable"><div>
<div class="field"><label>Nombres y apellidos:</label><input id="responsable" value="YULISA PERALA ROMERO"></div><div class="field"><label>Cargo:</label><input id="cargoResp" value="SSOMA"></div><div class="field"><label>Fecha:</label><input id="fechaResp" type="date" value="2026-10-25"></div>
</div><div class="sig"><button onclick="openSignature('responsable')">Firmar responsable</button><img id="firma-responsable" style="display:none" alt="Firma del responsable"></div></section>
<h2><input class="editable-title" id="t5" value="5. OBSERVACIONES"></h2><textarea id="observaciones" class="obs" placeholder="Escriba las observaciones..."></textarea>
<div class="field" style="margin-top:12px"><label>Nota final:</label><textarea id="nota">Este documento constituye evidencia de la difusión, comunicación y recepción de la política por parte del personal.</textarea></div>
<div class="footer"><input id="pie1" value="RJ GONZALES | Gestión SSOMA"><input id="pie2" value="Versión 001" style="text-align:right"></div>
</main>
<div class="modal" id="modal"><div class="card"><h3>Agregar firma</h3><p>Puede firmar a mano alzada o cargar una foto de la firma.</p><canvas id="canvas" width="1000" height="420"></canvas><div class="actions"><label class="upload">Cargar foto de firma<input id="signatureFile" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button class="gray" onclick="eraseSignature()">Borrar</button><button class="red" onclick="closeSignature()">Cancelar</button><button onclick="saveSignature()">Guardar firma a mano</button></div></div></div>
<script>
const $=id=>document.getElementById(id), tbody=$('rows'); let currentSignature=null,drawing=false,last=null;
const ids=['titulo','subtitulo','codigo','version','fecha','t1','empresa','documento','version2','fecha2','t2','constancia','t3','t4','responsable','cargoResp','fechaResp','t5','observaciones','nota','pie1','pie2'];
let store=null;try{store=window.localStorage}catch(e){}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function addRow(d={}){let i=tbody.rows.length+1,tr=tbody.insertRow();tr.innerHTML=`<td class="num">${i}</td><td><input value="${esc(d.nombre)}" placeholder="Apellidos y nombres"></td><td><input value="${esc(d.dni)}" placeholder="DNI"></td><td><input value="${esc(d.cargo)}" placeholder="Cargo"></td><td><input value="${esc(d.area)}" placeholder="Empresa / Área"></td><td class="sig"><button onclick="openSignature('p-${i-1}')">Firmar</button><img id="firma-p-${i-1}" src="${d.firma||''}" style="display:${d.firma?'block':'none'}"></td><td><input type="date" value="${d.fecha||$('fecha').value}"></td><td><button class="remove" onclick="removeRow(this)">X</button></td>`}
function removeRow(b){b.closest('tr').remove();renumber()}
function renumber(){[...tbody.rows].forEach((r,i)=>{r.cells[0].textContent=i+1;let b=r.querySelector('.sig button'),im=r.querySelector('.sig img');b.setAttribute('onclick',`openSignature('p-${i}')`);im.id=`firma-p-${i}`})}
function collect(){let fields={};ids.forEach(id=>fields[id]=$(id).value);return{fields,logo:$('logo').src.startsWith('data:')?$('logo').src:'',responsibleSignature:$('firma-responsable').src.startsWith('data:')?$('firma-responsable').src:'',people:[...tbody.rows].map(r=>{let x=r.querySelectorAll('td input');return{nombre:x[0].value,dni:x[1].value,cargo:x[2].value,area:x[3].value,fecha:x[4].value,firma:r.querySelector('.sig img').src.startsWith('data:')?r.querySelector('.sig img').src:''}})}}
function saveData(){if(!store){$('status').textContent='El guardado local no está disponible en esta vista previa.';return}store.setItem('cargoEditableRJ',JSON.stringify(collect()));$('status').textContent='Datos guardados en este navegador.'}
function loadData(){let d;if(store)try{d=JSON.parse(store.getItem('cargoEditableRJ'))}catch(e){};if(!d){for(let i=0;i<15;i++)addRow();return}Object.entries(d.fields||{}).forEach(([k,v])=>{if($(k))$(k).value=v});if(d.logo)showLogo(d.logo);if(d.responsibleSignature){$('firma-responsable').src=d.responsibleSignature;$('firma-responsable').style.display='block'};(d.people||[]).forEach(addRow);if(!tbody.rows.length)addRow()}
function clearData(){if(confirm('¿Desea borrar todos los datos, firmas y logo?')){if(store)store.removeItem('cargoEditableRJ');location.reload()}}
$('logoFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024){alert('El logo debe pesar menos de 3 MB.');return}let r=new FileReader();r.onload=()=>{showLogo(r.result);saveData()};r.readAsDataURL(f)});
function showLogo(src){$('logo').src=src;$('logo').style.display='block';$('fallback').style.display='none'}
const c=$('canvas'),ctx=c.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#102b3a';
function xy(e){let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}
function start(e){e.preventDefault();drawing=true;last=xy(e)}function move(e){if(!drawing)return;e.preventDefault();let p=xy(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){drawing=false}
['mousedown','touchstart'].forEach(v=>c.addEventListener(v,start,{passive:false}));['mousemove','touchmove'].forEach(v=>c.addEventListener(v,move,{passive:false}));['mouseup','mouseleave','touchend'].forEach(v=>c.addEventListener(v,end));
function openSignature(id){currentSignature=id;eraseSignature();let im=$('firma-'+id);if(im&&im.src.startsWith('data:')){let t=new Image();t.onload=()=>ctx.drawImage(t,0,0,c.width,c.height);t.src=im.src}$('modal').classList.add('open')}
function eraseSignature(){ctx.clearRect(0,0,c.width,c.height)}function closeSignature(){$('modal').classList.remove('open');currentSignature=null;$('signatureFile').value=''}function saveSignature(){if(!currentSignature)return;let im=$('firma-'+currentSignature);im.src=c.toDataURL('image/png');im.style.display='block';closeSignature();saveData()}
$('signatureFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f||!currentSignature)return;if(f.size>3*1024*1024){alert('La foto de firma debe pesar menos de 3 MB.');return}let r=new FileReader();r.onload=()=>{let im=$('firma-'+currentSignature);im.src=r.result;im.style.display='block';closeSignature();saveData()};r.readAsDataURL(f)})
function downloadPDF(){saveData();$('status').textContent='En la ventana de impresión, seleccione Guardar como PDF o Descargar como PDF.';document.title=($('empresa').value||'Empresa')+'_Cargo_entrega';window.print()}
loadData();
</script></body></html>
